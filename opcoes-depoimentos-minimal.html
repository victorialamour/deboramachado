<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depoimentos, versão pequena e calma | Débora Machado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--white:#fff;--off:#f5f5f3;--line:#dcdcd8;--gray:#76766f;--soft:#4f4f4d;--black:#0b0b0b;--serif:'Cormorant Garamond',serif;--sans:'Jost',sans-serif;--ease:cubic-bezier(.23,1,.32,1);--g:clamp(22px,5vw,72px)}
  *{box-sizing:border-box}
  ::selection{background:var(--black);color:#fff}
  body{margin:0;background:var(--white);font-family:var(--sans);font-weight:300;color:var(--black);-webkit-font-smoothing:antialiased}
  p,h2,figure,blockquote{margin:0;padding:0}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--black);outline-offset:4px}
  .intro{padding:48px var(--g) 24px;background:#e9e9e6}
  .intro h1{font:300 clamp(1.8rem,3.4vw,2.4rem)/1.1 var(--serif);margin:0 0 10px}
  .intro p{color:var(--soft);line-height:1.6;max-width:52em;font-size:15px}
  .note{display:flex;gap:14px;align-items:baseline;padding:24px var(--g) 16px;background:#e9e9e6;border-top:1px solid var(--line)}
  .note b{font:300 1.4rem/1 var(--serif);min-width:1.5ch}
  .note span{font-size:13.5px;line-height:1.5;color:var(--soft);max-width:58em;flex:1}
  .rp{flex:none;font:400 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;background:none;border:1px solid var(--black);padding:10px 14px;transition:background .2s var(--ease),color .2s var(--ease),transform .16s var(--ease)}
  .rp:active{transform:scale(.97)}
  @media (hover:hover) and (pointer:fine){.rp:hover{background:var(--black);color:#fff}}

  .st{padding:clamp(72px,10vw,120px) var(--g)}
  .box{max-width:520px;margin:0 auto}
  .h2{font:300 italic 1.05rem/1.2 var(--serif);color:var(--gray);margin-bottom:28px}
  .qt{font:300 clamp(1.25rem,1.9vw,1.5rem)/1.5 var(--serif);color:#1d1d1d;letter-spacing:0;text-wrap:pretty}
  .who{font:400 12px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gray);margin-top:16px}

  /* A · uma por vez, cruzando devagar */
  .a .stack{position:relative;min-height:9.5em}
  .a .sl{position:absolute;inset:0 0 auto 0;opacity:0;transition:opacity 1.2s var(--ease);pointer-events:none}
  .a .sl.on{opacity:1;pointer-events:auto}
  .a .ticks{display:flex;gap:8px;margin-top:26px}
  .a .ticks button{all:unset;box-sizing:border-box;width:30px;height:24px;display:grid;align-items:center;cursor:pointer}
  .a .ticks button::after{content:"";height:1px;background:var(--line);transition:background .4s var(--ease)}
  .a .ticks button[aria-current="true"]::after{background:var(--black)}
  .a .ticks button:focus-visible{outline:2px solid var(--black);outline-offset:1px}

  /* B · duas colunas pequenas, o filete desenha */
  .b .duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,64px)}
  .b .c{opacity:0;transform:translateY(8px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
  .b .c::before{content:"";display:block;height:1px;background:var(--black);margin-bottom:18px;transform:scaleX(0);transform-origin:0 50%;transition:transform 1.1s var(--ease)}
  .b.in .c{opacity:1;transform:none}
  .b.in .c::before{transform:none}
  .b.in .c:nth-child(2),.b.in .c:nth-child(2)::before{transition-delay:.25s}
  .b .qt{font-size:clamp(1.1rem,1.6vw,1.3rem)}
  @media (max-width:640px){.b .duo{grid-template-columns:1fr;gap:36px}}

  /* C · palavra a palavra, bem sutil */
  .c3 .w{opacity:0;transition:opacity .9s var(--ease)}
  .c3.in .w{opacity:1}
  .c3 .who{opacity:0;transition:opacity 1s var(--ease) 1.4s}.c3.in .who{opacity:1}
  .c3 .it+.it{margin-top:40px}
  @media (prefers-reduced-motion:reduce){.a .sl,.b .c,.b .c::before,.c3 .w,.c3 .who{transition:none!important;transform:none!important;opacity:1!important}.a .sl:not(.on){opacity:0!important}}
</style>
</head>
<body>
<div class="intro">
  <h1>Depoimentos, versão pequena e calma</h1>
  <p>Texto do tamanho de leitura, uma coluna estreita e muito branco em volta. O movimento é quase invisível: um fade lento. Três jeitos, sem imagens.</p>
</div>
<div id="app"></div>
<script>
const Q=[
 {n:'Mayra Fagundes',r:'noiva',t:'O seu moodboard é surpreendente e muito certeiro, deu o toque final que faltava na minha produção. Com certeza você foi minha melhor escolha.'},
 {n:'Priscilla',r:'noiva da Equipe DM',t:'As meninas são excelentes, de verdade! Eu amei o meu penteado e a maquiagem. Durou até o dia seguinte! Um sonho mesmo.'}
];
const who=q=>`<p class="who">${q.n} · ${q.r}</p>`;
const H='<h2 class="h2">Quem já passou por aqui</h2>';
const B=[];
const add=(n,d,cls,inner)=>B.push(`<div class="note"><b>${n}</b><span>${d}</span><button class="rp" type="button" data-t=".${cls}">Repetir</button></div><section class="st ${cls}"><div class="box">${H}${inner}</div></section>`);
add('A','Uma de cada vez. A frase some e a outra aparece num fade de mais de um segundo, a cada 8 s. Dois traços finos mostram qual é e deixam trocar.','a',
 `<div class="stack">${Q.map((q,i)=>`<figure class="sl${i===0?' on':''}"><blockquote class="qt">${q.t}</blockquote>${who(q)}</figure>`).join('')}</div><div class="ticks" role="group" aria-label="Escolher depoimento">${Q.map((q,i)=>`<button aria-label="Depoimento ${i+1}" aria-current="${i===0}"></button>`).join('')}</div>`);
add('B','Duas colunas. Cada uma ganha um filete fino que se desenha e o texto sobe só alguns pixels. Pequeno, lado a lado, e empilha no celular.','b',
 `<div class="duo">${Q.map(q=>`<figure class="c"><blockquote class="qt">${q.t}</blockquote>${who(q)}</figure>`).join('')}</div>`);
add('C','Palavra a palavra, bem sutil. Cada palavra surge sem movimento, só com a opacidade. O nome entra depois que a frase termina.','c3',
 Q.map(q=>`<figure class="it"><blockquote class="qt" data-w="1">${q.t}</blockquote>${who(q)}</figure>`).join(''));
document.getElementById('app').innerHTML=B.join('')+'<div style="height:50px"></div>';
document.querySelectorAll('[data-w]').forEach(el=>{el.innerHTML=el.textContent.split(' ').map((w,i)=>`<span class="w" style="transition-delay:${(i*.05).toFixed(2)}s">${w}</span>`).join(' ')});
const secs=[...document.querySelectorAll('.st')];
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.4});secs.forEach(s=>io.observe(s))}else secs.forEach(s=>s.classList.add('in'));
document.querySelectorAll('.rp').forEach(b=>b.addEventListener('click',()=>{const s=document.querySelector(b.dataset.t);s.classList.remove('in');void s.offsetWidth;setTimeout(()=>s.classList.add('in'),60)}));
/* A */
(function(){const sl=[...document.querySelectorAll('.a .sl')],tk=[...document.querySelectorAll('.a .ticks button')];let i=0,t;const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const go=n=>{i=n;sl.forEach((s,k)=>s.classList.toggle('on',k===i));tk.forEach((d,k)=>d.setAttribute('aria-current',k===i))};
const run=()=>{clearInterval(t);if(!calm)t=setInterval(()=>go((i+1)%sl.length),8000)};
tk.forEach((d,k)=>d.addEventListener('click',()=>{go(k);run()}));run()})();
</script>
</body>
</html>
