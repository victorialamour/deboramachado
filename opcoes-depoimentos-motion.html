<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depoimentos em movimento, sem imagens | Débora Machado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--white:#fff;--off:#f5f5f3;--line:#dcdcd8;--gray:#76766f;--soft:#4f4f4d;--black:#0b0b0b;--serif:'Cormorant Garamond',serif;--sans:'Jost',sans-serif;--ease:cubic-bezier(.23,1,.32,1);--g:clamp(22px,5vw,72px)}
  *{box-sizing:border-box}
  ::selection{background:var(--black);color:#fff}
  body{margin:0;background:var(--white);font-family:var(--sans);font-weight:300;color:var(--black);-webkit-font-smoothing:antialiased}
  p,h2,figure,blockquote{margin:0;padding:0}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--black);outline-offset:4px}
  .intro{padding:52px var(--g) 28px;background:#e9e9e6}
  .intro h1{font:300 clamp(2rem,4vw,3rem)/1.05 var(--serif);margin:0 0 12px}
  .intro p{color:var(--soft);line-height:1.6;max-width:56em}
  .note{display:flex;gap:16px;align-items:baseline;padding:28px var(--g) 18px;background:#e9e9e6;border-top:1px solid var(--line)}
  .note b{font:300 1.7rem/1 var(--serif);min-width:2ch}
  .note span{font-size:13.5px;line-height:1.5;color:var(--soft);max-width:60em;flex:1}
  .rp{flex:none;font:400 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;background:none;border:1px solid var(--black);padding:11px 16px;transition:background .2s var(--ease),color .2s var(--ease),transform .16s var(--ease)}
  .rp:active{transform:scale(.97)}
  @media (hover:hover) and (pointer:fine){.rp:hover{background:var(--black);color:#fff}}
  .st{padding:clamp(64px,9vw,120px) var(--g);min-height:clamp(420px,56vw,560px)}
  .wrap{max-width:900px;margin:0 auto}
  .h2{font:300 italic clamp(1.3rem,2vw,1.6rem)/1.2 var(--serif);color:var(--gray);margin-bottom:clamp(24px,4vw,40px)}
  .qt{font:300 clamp(1.9rem,4.4vw,3.2rem)/1.14 var(--serif);letter-spacing:-.015em;color:var(--black)}
  .qt+.who,.who+.qt{margin-top:0}
  .who{font:400 12px/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin-top:22px}
  .who::before{content:"";display:block;width:36px;height:1px;background:var(--black);margin-bottom:14px}
  .item+.item{margin-top:clamp(40px,6vw,64px)}

  /* 1 · linha a linha */
  .o1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
  .o1 .ln>span{display:block;transform:translateY(105%);transition:transform .9s var(--ease)}
  .o1.in .ln>span{transform:none}
  .o1 .who{opacity:0;transform:translateY(8px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
  .o1.in .who{opacity:1;transform:none}

  /* 2 · palavra a palavra, de desfocada a nítida */
  .o2 .w{display:inline-block;opacity:0;filter:blur(7px);transform:translateY(10px);transition:opacity .7s var(--ease),filter .7s var(--ease),transform .7s var(--ease)}
  .o2.in .w{opacity:1;filter:none;transform:none}
  .o2 .who{opacity:0;transition:opacity .8s var(--ease)}
  .o2.in .who{opacity:1}

  /* 3 · troca vertical com barra de tempo */
  .o3 .stack{position:relative;min-height:clamp(250px,34vw,330px)}
  .o3 .sl{position:absolute;inset:0 0 auto 0;opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease);pointer-events:none}
  .o3 .sl.on{opacity:1;transform:none;pointer-events:auto}
  .o3 .sl.out{opacity:0;transform:translateY(-24px)}
  .o3 .bar{height:1px;background:var(--line);margin-top:34px;position:relative;overflow:hidden}
  .o3 .bar i{position:absolute;inset:0;background:var(--black);transform:scaleX(0);transform-origin:0 50%}
  .o3 .bar i.run{animation:fill 7s linear forwards}
  @keyframes fill{to{transform:scaleX(1)}}
  .o3 .nx{margin-top:16px;font:400 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;background:none;border:0;padding:12px 0;color:var(--gray)}
  .o3 .nx:hover{color:var(--black)}

  /* 4 · grifo que corre */
  .o4 mark{background:linear-gradient(transparent 62%,#e9dccd 62%) no-repeat 0 0/0% 100%;color:inherit;transition:background-size 1.1s var(--ease)}
  .o4.in mark{background-size:100% 100%}
  .o4.in mark.m2{transition-delay:.5s}
  .o4 .who{opacity:0;transition:opacity .8s var(--ease) .9s}.o4.in .who{opacity:1}

  /* 5 · o filete desenha, o texto sobe */
  .o5 .fil{height:1px;background:var(--black);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.1s var(--ease);margin-bottom:34px}
  .o5.in .fil{transform:none}
  .o5 .qt,.o5 .who{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .o5 .qt{transition-delay:.55s}.o5 .who{transition-delay:1s}
  .o5.in .qt,.o5.in .who{opacity:1;transform:none}

  /* 6 · leitura pela rolagem */
  .o6 .w{color:#d4d2cc;transition:color .35s var(--ease)}
  .o6 .w.on{color:var(--black)}
  .o6 .qt{font-size:clamp(2rem,4.8vw,3.6rem)}
  .o6 .tall{min-height:1px}

  @media (prefers-reduced-motion:reduce){
    .o1 .ln>span,.o2 .w,.o5 .qt,.o5 .who,.o5 .fil,.o1 .who,.o2 .who,.o4 .who{transform:none!important;opacity:1!important;filter:none!important;transition:none!important}
    .o4 mark{background-size:100% 100%;transition:none}
    .o3 .bar i{display:none}.o6 .w{color:var(--black)}
  }
</style>
</head>
<body>
<div class="intro">
  <h1>Depoimentos em movimento, sem imagens</h1>
  <p>Seis ideias simples, só com texto e linhas finas. Cada uma tem um único gesto, curto, que acontece quando a seção entra na tela. O botão "Repetir" mostra de novo. Para quem prefere menos movimento, o texto aparece parado.</p>
</div>
<div id="app"></div>

<script>
const Q=[
 {n:'Mayra Fagundes',r:'noiva',t:'O seu moodboard é surpreendente e muito certeiro, deu o toque final que faltava na minha produção. Com certeza você foi minha melhor escolha.'},
 {n:'Priscilla',r:'noiva da Equipe DM',t:'As meninas são excelentes, de verdade! Eu amei o meu penteado e a maquiagem. Durou até o dia seguinte! Um sonho mesmo.'}
];
const who=q=>`<p class="who">${q.n} · ${q.r}</p>`;
const H='<h2 class="h2">Quem já passou por aqui</h2>';
const blocks=[];
const add=(n,d,cls,inner)=>blocks.push(`<div class="note"><b>${n}</b><span>${d}</span><button class="rp" type="button" data-t=".${cls}">Repetir</button></div><section class="st ${cls}"><div class="wrap">${H}${inner}</div></section>`);

add(1,'Linha a linha. Cada linha da frase sobe de dentro de uma máscara, uma depois da outra, e o nome aparece por último. Silencioso e elegante.','o1',
 Q.map(q=>`<figure class="item"><blockquote class="qt" data-split="lines">${q.t}</blockquote>${who(q)}</figure>`).join(''));
add(2,'Palavra a palavra. As palavras surgem desfocadas e ficam nítidas em sequência, como quando o olho foca. Dá a sensação de alguém falando.','o2',
 Q.map(q=>`<figure class="item"><blockquote class="qt" data-split="words">${q.t}</blockquote>${who(q)}</figure>`).join(''));
add(3,'Troca vertical. Um depoimento por vez; o antigo sobe e some, o novo chega por baixo. Uma linha fina mostra o tempo (7 s). Toque em "Próximo" para adiantar.','o3',
 `<div class="stack">${Q.map((q,i)=>`<figure class="sl${i===0?' on':''}"><blockquote class="qt">${q.t}</blockquote>${who(q)}</figure>`).join('')}</div><div class="bar"><i></i></div><button class="nx" type="button">Próximo</button>`);
add(4,'Grifo que corre. A frase fica parada e as duas partes que mais dizem ganham um grifo cor de areia que corre da esquerda para a direita. Só um detalhe, muito delicado.','o4',
 `<figure class="item"><blockquote class="qt">O seu moodboard é surpreendente e <mark>muito certeiro</mark>, deu o toque final que faltava na minha produção. Com certeza você foi minha melhor escolha.</blockquote>${who(Q[0])}</figure><figure class="item"><blockquote class="qt">As meninas são excelentes, de verdade! Eu amei o meu penteado e a maquiagem. Durou até o dia seguinte! <mark class="m2">Um sonho mesmo.</mark></blockquote>${who(Q[1])}</figure>`);
add(5,'O filete desenha. Uma linha fina corre pela largura inteira, depois a frase sobe e, por fim, o nome. Três tempos, nada mais. É o mais simples.','o5',
 Q.map(q=>`<figure class="item"><div class="fil"></div><blockquote class="qt">${q.t}</blockquote>${who(q)}</figure>`).join(''));
add(6,'Leitura pela rolagem. A frase começa em cinza claro e vai escurecendo palavra por palavra enquanto a pessoa rola. Convida a ler com calma. Não precisa de botão.','o6',
 `<div class="item"><blockquote class="qt" data-split="words" data-scroll="1">${Q[0].t}</blockquote>${who(Q[0])}</div><div class="item"><blockquote class="qt" data-split="words" data-scroll="1">${Q[1].t}</blockquote>${who(Q[1])}</div>`);

document.getElementById('app').innerHTML=blocks.join('')+'<div style="height:60px"></div>';

/* separar palavras */
const wordify=el=>{const t=el.textContent;el.innerHTML=t.split(' ').map((w,i)=>`<span class="w" style="transition-delay:${(i*0.045).toFixed(3)}s">${w}</span>`).join(' ')};
document.querySelectorAll('[data-split=words]').forEach(el=>{
  if(el.closest('.o6')){const t=el.textContent;el.innerHTML=t.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}else wordify(el)});
/* separar linhas */
const lineify=el=>{
  if(!el.dataset.orig)el.dataset.orig=el.textContent;
  el.innerHTML=el.dataset.orig.split(' ').map(w=>`<span class="w" style="display:inline-block">${w}</span>`).join(' ');
  const ws=[...el.querySelectorAll('.w')];const lines=[];let top=null;
  ws.forEach(w=>{const t=w.offsetTop;if(top===null||Math.abs(t-top)>4){lines.push([]);top=t}lines[lines.length-1].push(w.textContent)});
  el.innerHTML=lines.map((l,i)=>`<span class="ln"><span style="transition-delay:${(i*0.12).toFixed(2)}s">${l.join(' ')}</span></span>`).join('')};
const doLines=()=>document.querySelectorAll('[data-split=lines]').forEach(lineify);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(doLines);else doLines();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(doLines,200)});

/* disparo ao entrar na tela */
const secs=[...document.querySelectorAll('.st')];
const play=s=>s.classList.add('in');
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){play(x.target);if(x.target.classList.contains('o3'))startO3();io.unobserve(x.target)}}),{threshold:.35});secs.forEach(s=>io.observe(s))}else secs.forEach(play);
document.querySelectorAll('.rp').forEach(b=>b.addEventListener('click',()=>{const s=document.querySelector(b.dataset.t);s.classList.remove('in');if(s.classList.contains('o3')){resetO3();}void s.offsetWidth;setTimeout(()=>{play(s);if(s.classList.contains('o3'))startO3()},60)}));

/* 3 · troca vertical */
const sls=[...document.querySelectorAll('.o3 .sl')],bar=document.querySelector('.o3 .bar i');let cur=0,tm;
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const show=n=>{const old=sls[cur];old.classList.remove('on');old.classList.add('out');setTimeout(()=>old.classList.remove('out'),700);cur=n;sls[cur].classList.add('on')};
function startO3(){clearInterval(tm);if(calm)return;bar.classList.remove('run');void bar.offsetWidth;bar.classList.add('run');tm=setInterval(()=>{show((cur+1)%sls.length);bar.classList.remove('run');void bar.offsetWidth;bar.classList.add('run')},7000)}
function resetO3(){clearInterval(tm);bar.classList.remove('run');sls.forEach((s,k)=>{s.classList.remove('on','out');if(k===0)s.classList.add('on')});cur=0}
document.querySelector('.o3 .nx').addEventListener('click',()=>{show((cur+1)%sls.length);startO3()});

/* 6 · leitura pela rolagem */
const o6=[...document.querySelectorAll('.o6 .qt')];
const upd=()=>{const vh=innerHeight;o6.forEach(q=>{const ws=[...q.querySelectorAll('.w')],r=q.getBoundingClientRect();const p=Math.min(1,Math.max(0,(vh*.85-r.top)/(vh*.55+r.height*.4)));const n=Math.round(p*ws.length);ws.forEach((w,i)=>w.classList.toggle('on',i<n||calm))})};
addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();
</script>
</body>
</html>
